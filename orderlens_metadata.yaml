data_model: OrderLensReact
schema: React_OrderLens
storage_format: Delta
domains:
  customer:
    customer_dealer_relationships:
      table_name: customer_dealer_relationships
      description: Links sales orders to the dealer and end customer involved, capturing the relationship
        between dealers and their end customers on each order.
      schema: React_OrderLens
      storage_format: Delta
      columns:
      - name: sales_order_id
        data_type: STRING
        description: Unique identifier for the sales order
      - name: dealer_key
        data_type: STRING
        description: Unique identifier for the dealer
      - name: dealer_name
        data_type: STRING
        description: Name of the dealer
      - name: end_customer_key
        data_type: STRING
        description: Unique identifier for the end customer associated with the order
      - name: end_customer_name
        data_type: STRING
        description: Name of the end customer
      - name: end_customer_country
        data_type: STRING
        description: Country code of the end customer
      - name: end_customer_region
        data_type: STRING
        description: Region of the end customer
      - name: order_created_datetime
        data_type: TIMESTAMP
        description: Date and time the order was created
      - name: total_order_value
        data_type: DECIMAL(18,2)
        description: Total value of the order
      - name: sales_order_category
        data_type: STRING
        description: Category classification of the sales order
    customer_lifetime_value:
      table_name: customer_lifetime_value
      description: Summarizes cumulative order activity and value per customer to support lifetime value
        analysis.
      schema: React_OrderLens
      storage_format: Delta
      columns:
      - name: customer_key
        data_type: STRING
        description: Unique identifier for the customer
      - name: customer_name
        data_type: STRING
        description: Name of the customer
      - name: customer_type
        data_type: STRING
        description: Type/classification of the customer
      - name: country_code
        data_type: STRING
        description: Country code
      - name: total_orders
        data_type: INT
        description: Total number of orders
      - name: lifetime_value
        data_type: DECIMAL(18,2)
        description: Total lifetime value of the customer
      - name: avg_order_value
        data_type: DECIMAL(18,2)
        description: Average value per order
      - name: first_order_date
        data_type: TIMESTAMP
        description: Date of the customer's first order
      - name: last_order_date
        data_type: TIMESTAMP
        description: Date of the customer's most recent order
      - name: product_categories_purchased
        data_type: INT
        description: Number of distinct product categories purchased by the customer
    customer_order_history:
      table_name: customer_order_history
      description: Detailed historical record of orders placed by each customer.
      schema: React_OrderLens
      storage_format: Delta
      columns:
      - name: customer_key
        data_type: STRING
        description: Unique identifier for the customer
      - name: customer_name
        data_type: STRING
        description: Name of the customer
      - name: customer_type
        data_type: STRING
        description: Type/classification of the customer
      - name: sales_order_id
        data_type: STRING
        description: Unique identifier for the sales order
      - name: order_date_key
        data_type: INT
        description: Date key (surrogate date reference) of the order
      - name: order_created_datetime
        data_type: TIMESTAMP
        description: Date and time the order was created
      - name: sales_order_category
        data_type: STRING
        description: Category classification of the sales order
      - name: currency_code
        data_type: STRING
        description: Currency code of the associated monetary values
      - name: net_order_value
        data_type: DECIMAL(18,2)
        description: Net value of the order excluding taxes/surcharges
      - name: gross_order_value
        data_type: DECIMAL(18,2)
        description: Gross value of the order including taxes/surcharges
      - name: total_order_value
        data_type: DECIMAL(18,2)
        description: Total value of the order
      - name: overall_order_status
        data_type: STRING
        description: Overall status of the order
      - name: sales_org_code
        data_type: STRING
        description: Sales organization code
      - name: distribution_channel_code
        data_type: STRING
        description: Distribution channel code
    customer_profile:
      table_name: customer_profile
      description: Master profile attributes describing each customer, including location and account
        creation details.
      schema: React_OrderLens
      storage_format: Delta
      columns:
      - name: customer_key
        data_type: STRING
        description: Unique identifier for the customer
      - name: customer_name
        data_type: STRING
        description: Name of the customer
      - name: customer_type
        data_type: STRING
        description: Type/classification of the customer
      - name: country_code
        data_type: STRING
        description: Country code
      - name: region_code
        data_type: STRING
        description: Region code
      - name: city
        data_type: STRING
        description: City name
      - name: postal_code
        data_type: STRING
        description: Postal code
      - name: street_address
        data_type: STRING
        description: Street address
      - name: customer_created_date
        data_type: DATE
        description: Date the customer record was created
    customer_recency_frequency:
      table_name: customer_recency_frequency
      description: Recency and frequency metrics per customer, summarizing order timing patterns and customer
        status.
      schema: React_OrderLens
      storage_format: Delta
      columns:
      - name: customer_key
        data_type: STRING
        description: Unique identifier for the customer
      - name: customer_name
        data_type: STRING
        description: Name of the customer
      - name: customer_type
        data_type: STRING
        description: Type/classification of the customer
      - name: last_order_date
        data_type: TIMESTAMP
        description: Date of the customer's most recent order
      - name: days_since_last_order
        data_type: INT
        description: Number of days elapsed since the customer's last order
      - name: total_orders
        data_type: INT
        description: Total number of orders
      - name: customer_lifespan_days
        data_type: INT
        description: Number of days between the customer's first and last order
      - name: orders_per_year
        data_type: DECIMAL(9,2)
        description: Average number of orders placed per year
      - name: customer_status
        data_type: STRING
        description: Derived status classification of the customer (e.g., active/inactive)
  dealer:
    dealer_channel_summary:
      table_name: dealer_channel_summary
      description: Aggregated order and fulfillment metrics by sales organization, country, and region,
        summarizing dealer channel activity.
      schema: React_OrderLens
      storage_format: Delta
      columns:
      - name: sales_org_code
        data_type: STRING
        description: Sales organization code
      - name: country_code
        data_type: STRING
        description: Country code
      - name: region_code
        data_type: STRING
        description: Region code
      - name: active_dealers
        data_type: INT
        description: Count of active dealers
      - name: total_orders
        data_type: INT
        description: Total number of orders
      - name: total_order_value
        data_type: DECIMAL(18,2)
        description: Total value of the order
      - name: avg_order_value
        data_type: DECIMAL(18,2)
        description: Average value per order
      - name: retail_orders
        data_type: INT
        description: Count of retail orders
      - name: stock_orders
        data_type: INT
        description: Count of stock orders
      - name: retail_order_pct
        data_type: DECIMAL(9,2)
        description: Percentage of orders classified as retail
      - name: fulfilled_orders
        data_type: INT
        description: Count of orders that have been fulfilled
      - name: fulfillment_rate_pct
        data_type: DECIMAL(9,2)
        description: Percentage of orders fulfilled
      - name: parts_orders
        data_type: INT
        description: Count of orders for parts
      - name: equipment_orders
        data_type: INT
        description: Count of orders for equipment
      - name: service_orders
        data_type: INT
        description: Count of orders for service
      - name: engine_orders
        data_type: INT
        description: Count of orders for engines
    dealer_fulfillment_analysis:
      table_name: dealer_fulfillment_analysis
      description: Order fulfillment performance metrics by dealer, including blocked-order counts and
        fulfillment rates.
      schema: React_OrderLens
      storage_format: Delta
      columns:
      - name: dealer_key
        data_type: STRING
        description: Unique identifier for the dealer
      - name: dealer_name
        data_type: STRING
        description: Name of the dealer
      - name: dealer_country
        data_type: STRING
        description: Country code of the dealer
      - name: sales_order_category
        data_type: STRING
        description: Category classification of the sales order
      - name: total_orders
        data_type: INT
        description: Total number of orders
      - name: total_order_value
        data_type: DECIMAL(18,2)
        description: Total value of the order
      - name: fulfilled_orders
        data_type: INT
        description: Count of orders that have been fulfilled
      - name: open_orders
        data_type: INT
        description: Count of orders that remain open
      - name: partially_fulfilled_orders
        data_type: INT
        description: Count of orders that are partially fulfilled
      - name: fulfillment_rate_pct
        data_type: DECIMAL(9,2)
        description: Percentage of orders fulfilled
      - name: avg_order_value
        data_type: DECIMAL(18,2)
        description: Average value per order
      - name: delivery_blocked_orders
        data_type: INT
        description: Count of orders blocked from delivery
      - name: billing_blocked_orders
        data_type: INT
        description: Count of orders blocked from billing
      - name: credit_blocked_orders
        data_type: INT
        description: Count of orders blocked due to credit hold
    dealer_order_performance:
      table_name: dealer_order_performance
      description: Order volume and value performance metrics by dealer.
      schema: React_OrderLens
      storage_format: Delta
      columns:
      - name: dealer_key
        data_type: STRING
        description: Unique identifier for the dealer
      - name: dealer_name
        data_type: STRING
        description: Name of the dealer
      - name: dealer_country
        data_type: STRING
        description: Country code of the dealer
      - name: dealer_region
        data_type: STRING
        description: Region of the dealer
      - name: total_orders
        data_type: INT
        description: Total number of orders
      - name: total_net_value
        data_type: DECIMAL(18,2)
        description: Total net value across orders
      - name: total_gross_value
        data_type: DECIMAL(18,2)
        description: Total gross value across orders
      - name: total_order_value
        data_type: DECIMAL(18,2)
        description: Total value of the order
      - name: avg_net_order_value
        data_type: DECIMAL(18,2)
        description: Average net value per order
      - name: avg_total_order_value
        data_type: DECIMAL(18,2)
        description: Average total value per order
      - name: fulfilled_orders
        data_type: INT
        description: Count of orders that have been fulfilled
      - name: open_orders
        data_type: INT
        description: Count of orders that remain open
      - name: partially_fulfilled_orders
        data_type: INT
        description: Count of orders that are partially fulfilled
    dealer_vs_end_customer_mix:
      table_name: dealer_vs_end_customer_mix
      description: Compares orders and order value attributable to identified end customers versus direct
        dealer orders.
      schema: React_OrderLens
      storage_format: Delta
      columns:
      - name: dealer_key
        data_type: STRING
        description: Unique identifier for the dealer
      - name: dealer_name
        data_type: STRING
        description: Name of the dealer
      - name: dealer_country
        data_type: STRING
        description: Country code of the dealer
      - name: total_orders
        data_type: INT
        description: Total number of orders
      - name: orders_with_end_customer
        data_type: INT
        description: Count of orders that identify an end customer
      - name: direct_dealer_orders
        data_type: INT
        description: Count of orders placed directly by the dealer without an end customer
      - name: total_order_value
        data_type: DECIMAL(18,2)
        description: Total value of the order
      - name: end_customer_order_value
        data_type: DECIMAL(18,2)
        description: Total order value attributed to orders with an identified end customer
      - name: direct_dealer_order_value
        data_type: DECIMAL(18,2)
        description: Total order value attributed to direct dealer orders
      - name: pct_orders_with_end_customer
        data_type: DECIMAL(9,2)
        description: Percentage of orders that identify an end customer
      - name: pct_value_with_end_customer
        data_type: DECIMAL(9,2)
        description: Percentage of order value attributed to orders with an end customer
  forecasting:
    forecasting_accuracy_by_material_plant_period:
      table_name: forecasting_accuracy_by_material_plant_period
      description: Forecast accuracy metrics by material, plant, and forecast period.
      schema: React_OrderLens
      storage_format: Delta
      columns:
      - name: material_key
        data_type: STRING
        description: Unique identifier for the material/product
      - name: plant_key
        data_type: STRING
        description: Unique identifier for the plant
      - name: forecast_period
        data_type: STRING
        description: Period identifier for the forecast
      - name: material_description
        data_type: STRING
        description: Descriptive text for the material
      - name: material_type_code
        data_type: STRING
        description: Material type classification code
      - name: material_group_code
        data_type: STRING
        description: Material group classification code
      - name: plant_name
        data_type: STRING
        description: Name of the plant
      - name: country_code
        data_type: STRING
        description: Country code
      - name: region_code
        data_type: STRING
        description: Region code
      - name: calendar_year
        data_type: INT
        description: Calendar year of the period
      - name: calendar_month
        data_type: INT
        description: Calendar month number of the period
      - name: month_name
        data_type: STRING
        description: Calendar month name
      - name: total_forecast_quantity
        data_type: DECIMAL(18,3)
        description: Total forecasted quantity
      - name: total_actual_sales_quantity
        data_type: DECIMAL(18,3)
        description: Total actual sales quantity
      - name: forecast_variance
        data_type: DECIMAL(18,3)
        description: Variance between forecasted and actual quantity
      - name: forecast_accuracy_percent
        data_type: DECIMAL(9,2)
        description: Accuracy of the forecast expressed as a percentage
      - name: absolute_percentage_error
        data_type: DECIMAL(9,2)
        description: Absolute percentage error of the forecast
    forecasting_method_performance:
      table_name: forecasting_method_performance
      description: Aggregated forecast accuracy performance by forecasting method.
      schema: React_OrderLens
      storage_format: Delta
      columns:
      - name: forecast_method_code
        data_type: STRING
        description: Code identifying the forecasting method used
      - name: material_type_code
        data_type: STRING
        description: Material type classification code
      - name: material_group_code
        data_type: STRING
        description: Material group classification code
      - name: country_code
        data_type: STRING
        description: Country code
      - name: forecast_count
        data_type: INT
        description: Count of forecasts
      - name: avg_accuracy_percent
        data_type: DECIMAL(9,2)
        description: Average forecast accuracy percentage
      - name: avg_absolute_percentage_error
        data_type: DECIMAL(9,2)
        description: Average absolute percentage error of forecasts
      - name: error_std_deviation
        data_type: DECIMAL(9,2)
        description: Standard deviation of forecast error
    forecasting_outlier_analysis:
      table_name: forecasting_outlier_analysis
      description: Individual forecast records highlighting variance outliers between forecasted and actual
        quantities.
      schema: React_OrderLens
      storage_format: Delta
      columns:
      - name: material_key
        data_type: STRING
        description: Unique identifier for the material/product
      - name: plant_key
        data_type: STRING
        description: Unique identifier for the plant
      - name: forecast_period
        data_type: STRING
        description: Period identifier for the forecast
      - name: material_description
        data_type: STRING
        description: Descriptive text for the material
      - name: material_type_code
        data_type: STRING
        description: Material type classification code
      - name: plant_name
        data_type: STRING
        description: Name of the plant
      - name: country_code
        data_type: STRING
        description: Country code
      - name: forecast_method_code
        data_type: STRING
        description: Code identifying the forecasting method used
      - name: forecast_quantity
        data_type: DECIMAL(18,3)
        description: Forecasted quantity
      - name: actual_sales_quantity
        data_type: DECIMAL(18,3)
        description: Actual sales quantity
      - name: variance
        data_type: DECIMAL(18,3)
        description: Variance between forecasted and actual quantity
      - name: absolute_percentage_error
        data_type: DECIMAL(9,2)
        description: Absolute percentage error of the forecast
      - name: variance_category
        data_type: STRING
        description: Categorization of the forecast variance
    forecasting_trend_analysis:
      table_name: forecasting_trend_analysis
      description: Forecast accuracy and volume trends aggregated by period, material type, and country.
      schema: React_OrderLens
      storage_format: Delta
      columns:
      - name: forecast_period
        data_type: STRING
        description: Period identifier for the forecast
      - name: calendar_year
        data_type: INT
        description: Calendar year of the period
      - name: calendar_month
        data_type: INT
        description: Calendar month number of the period
      - name: month_name
        data_type: STRING
        description: Calendar month name
      - name: material_type_code
        data_type: STRING
        description: Material type classification code
      - name: country_code
        data_type: STRING
        description: Country code
      - name: total_forecasts
        data_type: INT
        description: Total count of forecasts
      - name: total_forecast_quantity
        data_type: DECIMAL(18,3)
        description: Total forecasted quantity
      - name: total_actual_quantity
        data_type: DECIMAL(18,3)
        description: Total actual quantity
      - name: avg_accuracy_percent
        data_type: DECIMAL(9,2)
        description: Average forecast accuracy percentage
      - name: avg_absolute_percentage_error
        data_type: DECIMAL(9,2)
        description: Average absolute percentage error of forecasts
      - name: overforecast_count
        data_type: INT
        description: Count of forecasts that overestimated actual demand
      - name: underforecast_count
        data_type: INT
        description: Count of forecasts that underestimated actual demand
  inventory:
    inventory_current_stock_levels:
      table_name: inventory_current_stock_levels
      description: Current stock quantities by material, plant, and storage location as of the latest
        snapshot.
      schema: React_OrderLens
      storage_format: Delta
      columns:
      - name: material_key
        data_type: STRING
        description: Unique identifier for the material/product
      - name: material_description
        data_type: STRING
        description: Descriptive text for the material
      - name: material_type_code
        data_type: STRING
        description: Material type classification code
      - name: material_group_code
        data_type: STRING
        description: Material group classification code
      - name: product_hierarchy
        data_type: STRING
        description: Product hierarchy classification
      - name: plant_key
        data_type: STRING
        description: Unique identifier for the plant
      - name: plant_name
        data_type: STRING
        description: Name of the plant
      - name: country_code
        data_type: STRING
        description: Country code
      - name: region_code
        data_type: STRING
        description: Region code
      - name: storage_location_code
        data_type: STRING
        description: Storage location code
      - name: unrestricted_stock_quantity
        data_type: DECIMAL(18,3)
        description: Quantity of unrestricted (available) stock
      - name: stock_in_transfer_quantity
        data_type: DECIMAL(18,3)
        description: Quantity of stock currently in transfer
      - name: total_available_stock
        data_type: DECIMAL(18,3)
        description: Total available stock quantity
      - name: base_unit_of_measure
        data_type: STRING
        description: Base unit of measure for the material
      - name: snapshot_date_key
        data_type: INT
        description: Date key of the inventory snapshot
    inventory_plant_summary:
      table_name: inventory_plant_summary
      description: Plant-level summary of materials managed and stock levels relative to reorder and safety
        stock thresholds.
      schema: React_OrderLens
      storage_format: Delta
      columns:
      - name: plant_key
        data_type: STRING
        description: Unique identifier for the plant
      - name: plant_name
        data_type: STRING
        description: Name of the plant
      - name: country_code
        data_type: STRING
        description: Country code
      - name: region_code
        data_type: STRING
        description: Region code
      - name: city
        data_type: STRING
        description: City name
      - name: total_materials_managed
        data_type: INT
        description: Total count of materials managed at the plant
      - name: materials_below_reorder_point
        data_type: INT
        description: Count of materials below their reorder point
      - name: materials_below_safety_stock
        data_type: INT
        description: Count of materials below their safety stock level
      - name: total_unrestricted_stock
        data_type: DECIMAL(18,3)
        description: Total unrestricted stock quantity
      - name: total_stock_in_transfer
        data_type: DECIMAL(18,3)
        description: Total stock quantity in transfer
      - name: latest_snapshot_date
        data_type: INT
        description: Date key of the most recent inventory snapshot
    inventory_reorder_point_breaches:
      table_name: inventory_reorder_point_breaches
      description: Materials whose stock has fallen below their defined reorder point.
      schema: React_OrderLens
      storage_format: Delta
      columns:
      - name: material_key
        data_type: STRING
        description: Unique identifier for the material/product
      - name: material_description
        data_type: STRING
        description: Descriptive text for the material
      - name: material_type_code
        data_type: STRING
        description: Material type classification code
      - name: material_group_code
        data_type: STRING
        description: Material group classification code
      - name: plant_key
        data_type: STRING
        description: Unique identifier for the plant
      - name: plant_name
        data_type: STRING
        description: Name of the plant
      - name: country_code
        data_type: STRING
        description: Country code
      - name: storage_location_code
        data_type: STRING
        description: Storage location code
      - name: unrestricted_stock_quantity
        data_type: DECIMAL(18,3)
        description: Quantity of unrestricted (available) stock
      - name: reorder_point_quantity
        data_type: DECIMAL(18,3)
        description: Reorder point threshold quantity
      - name: reorder_shortage_quantity
        data_type: DECIMAL(18,3)
        description: Quantity by which stock falls short of the reorder point
      - name: mrp_controller_code
        data_type: STRING
        description: Material Requirements Planning (MRP) controller code
      - name: procurement_type_code
        data_type: STRING
        description: Procurement type code
      - name: planned_delivery_days
        data_type: INT
        description: Planned number of days for delivery
      - name: base_unit_of_measure
        data_type: STRING
        description: Base unit of measure for the material
      - name: snapshot_date_key
        data_type: INT
        description: Date key of the inventory snapshot
    inventory_safety_stock_coverage:
      table_name: inventory_safety_stock_coverage
      description: Materials' stock coverage relative to their defined safety stock levels.
      schema: React_OrderLens
      storage_format: Delta
      columns:
      - name: material_key
        data_type: STRING
        description: Unique identifier for the material/product
      - name: material_description
        data_type: STRING
        description: Descriptive text for the material
      - name: material_type_code
        data_type: STRING
        description: Material type classification code
      - name: material_group_code
        data_type: STRING
        description: Material group classification code
      - name: plant_key
        data_type: STRING
        description: Unique identifier for the plant
      - name: plant_name
        data_type: STRING
        description: Name of the plant
      - name: country_code
        data_type: STRING
        description: Country code
      - name: storage_location_code
        data_type: STRING
        description: Storage location code
      - name: unrestricted_stock_quantity
        data_type: DECIMAL(18,3)
        description: Quantity of unrestricted (available) stock
      - name: safety_stock_quantity
        data_type: DECIMAL(18,3)
        description: Safety stock threshold quantity
      - name: safety_stock_coverage_ratio
        data_type: DECIMAL(9,3)
        description: Ratio of available stock to safety stock requirement
      - name: below_safety_stock
        data_type: BOOLEAN
        description: Indicator of whether stock is below the safety stock level
      - name: safety_stock_shortage_quantity
        data_type: DECIMAL(18,3)
        description: Quantity by which stock falls short of the safety stock level
      - name: mrp_controller_code
        data_type: STRING
        description: Material Requirements Planning (MRP) controller code
      - name: base_unit_of_measure
        data_type: STRING
        description: Base unit of measure for the material
      - name: snapshot_date_key
        data_type: INT
        description: Date key of the inventory snapshot
  orders:
    orders_backlog_analysis:
      table_name: orders_backlog_analysis
      description: Open (backlogged) order lines with age, requested delivery timing, and backorder reason
        details.
      schema: React_OrderLens
      storage_format: Delta
      columns:
      - name: sales_order_id
        data_type: STRING
        description: Unique identifier for the sales order
      - name: sales_order_category
        data_type: STRING
        description: Category classification of the sales order
      - name: customer_name
        data_type: STRING
        description: Name of the customer
      - name: customer_type
        data_type: STRING
        description: Type/classification of the customer
      - name: order_date
